<!doctype html>
<html lang="pt-BR" data-tema="claro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="RH Macaw — gestao de pessoas, folha de pagamento e remessa bancaria para restaurantes." />
    <meta name="theme-color" content="#10151C" />
    <title>RH Macaw</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C5CAB'/%3E%3Cpath d='M9 23V9h7.2c3 0 4.8 1.7 4.8 4.3 0 2-1.1 3.4-2.9 4L23 23h-3.6l-3.3-5h-3.6v5H9Zm3.5-7.6h3.2c1.3 0 2.1-.7 2.1-1.9s-.8-1.9-2.1-1.9h-3.2v3.8Z' fill='%23E6B85C'/%3E%3C/svg%3E"
    />
    <script>
      // Aplica o tema salvo antes da primeira pintura para nao piscar.
      try {
        var t = localStorage.getItem('rhmacaw.tema');
        if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro';
        document.documentElement.setAttribute('data-tema', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
